[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diskcleaner"
version = "1.0.0"
description = "Safely de-duplicate and organize photos/videos on a recovered disk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
progress = ["tqdm>=4.66"]
dev = ["pytest>=8.0"]

[project.scripts]
diskcleaner = "diskcleaner.commands:main"

[tool.setuptools]
packages = ["diskcleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
